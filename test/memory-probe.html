<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FFmpeg 内存诊断</title>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #11151c; color: #e8eaed; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #9aa0a6; font-size: 12px; margin-bottom: 20px; }
  button { background: #00a1d6; color: #fff; border: none; border-radius: 6px; padding: 10px 22px; font-size: 14px; cursor: pointer; }
  button:disabled { background: #444; cursor: not-allowed; }
  #steps { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
  .step { background: #1a202b; border: 1px solid #2a3342; border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  .step .name { font-weight: 600; }
  .step .status { float: right; }
  .ok { color: #5dd39e; } .fail { color: #ff6b6b; } .run { color: #ffd166; } .skip { color: #9aa0a6; }
  .detail { margin-top: 6px; color: #b8bec7; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .verdict { border-left: 3px solid #00a1d6; padding-left: 10px; margin-top: 4px; }
  code { background: #232b38; border-radius: 3px; padding: 1px 5px; font-size: 12px; }
</style>
</head>
<body>
<h1>FFmpeg WASM 内存诊断</h1>
<div class="sub">探测当前 ffmpeg-core 构建的堆上限与 WORKERFS 可用性 · feature/ffmpeg-4gb 分支实验页</div>
<button id="run">开始诊断</button>
<div id="steps"></div>
<script src="memory-probe.js"></script>
</body>
</html>
