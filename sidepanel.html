<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilibili Downloader</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="header-title">Bilibili Downloader</h1>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="downloading">
        下载中 (<span id="downloading-count">0</span>)
      </button>
      <button class="tab" data-tab="completed">
        已完成 (<span id="completed-count">0</span>)
      </button>
      <button class="tab" data-tab="settings">
        设置
      </button>
    </nav>

    <div class="tab-content active" id="tab-downloading">
      <div class="toolbar">
        <button class="btn-clear" id="clear-failed">清理失败任务</button>
      </div>
      <div class="task-list" id="downloading-list">
        <div class="empty-state">暂无下载任务<br><span style="font-size:12px;color:#bbb;">在视频页面点击下载按钮开始</span></div>
      </div>
    </div>

    <div class="tab-content" id="tab-completed">
      <div class="task-list" id="completed-list">
        <div class="empty-state">暂无已完成任务</div>
      </div>
    </div>

    <div class="tab-content" id="tab-settings">
      <div class="settings-section">
        <h3>反检测设置</h3>
        <div class="setting-item">
          <label for="delay-min">最小延时 (ms)</label>
          <input type="number" id="delay-min" value="3000" min="1000" max="30000">
        </div>
        <div class="setting-item">
          <label for="delay-max">最大延时 (ms)</label>
          <input type="number" id="delay-max" value="12000" min="1000" max="60000">
        </div>
        <div class="setting-item">
          <label for="retry-times">重试次数</label>
          <input type="number" id="retry-times" value="3" min="1" max="10">
        </div>
      </div>
      <div class="settings-section">
        <h3>文件保存</h3>
        <div class="setting-item">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="delete-raw-after-merge" style="accent-color:#00a1d6;">
            <span>合并成功后删除原始文件</span>
          </label>
          <div class="setting-hint">仅删除音频(.m4s)和视频(.m4s)原始文件，保留合并后的.mp4</div>
        </div>
        <div class="setting-item">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="save-raw-files" style="accent-color:#00a1d6;">
            <span>保存原始音频和视频文件</span>
          </label>
          <div class="setting-hint">在子目录中保存 audio.m4s、video.m4s 和合并.bat 脚本</div>
        </div>
      </div>
      <button class="btn-save" id="save-settings">保存设置</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
